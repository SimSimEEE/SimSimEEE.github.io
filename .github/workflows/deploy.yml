name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (astro check + astro build)
        run: npm run build
        env:
          # Repository variable SITE_URL overrides the default site URL (e.g. once a custom domain is set).
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Drafts must not be published
        run: |
          if grep -rl --include='*.html' 'draft: true' dist; then echo "draft content in dist"; exit 1; fi
          test ! -d dist/posts/hello
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
